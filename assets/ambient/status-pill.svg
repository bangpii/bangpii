<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 44" width="212" height="44" role="img" aria-label="Open to collaboration">
  <title>Open to collaboration</title>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131C33"/>
      <stop offset="1" stop-color="#16143A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .sf-beacon { animation: sf-beacon 2.6s ease-in-out infinite; }
    @keyframes sf-beacon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sf-beacon { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="211" height="43" rx="22" fill="url(#shell)" stroke="url(#rim)"/>
  <circle class="sf-beacon" cx="24" cy="22" r="9" fill="url(#beacon)"/>
  <circle cx="24" cy="22" r="4.5" fill="#34D399"/>
  <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="500" letter-spacing="0.2" textLength="152" lengthAdjust="spacing" fill="#CBD5E8">Open to collaboration</text>
</svg>
