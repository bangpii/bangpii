<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Network topology: server rack to switch, router, and uplink">
  <title>Infrastructure and Network</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.45" stop-color="#0E1730"/>
      <stop offset="0.78" stop-color="#16143A"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#93A7CC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="180" rx="14"/>
    </clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <style>
    .pulse { animation: sf-pulse 7s linear infinite; }
    .breathe { animation: sf-breathe 9s ease-in-out infinite; }
    @keyframes sf-pulse { to { stroke-dashoffset: -260; } }
    @keyframes sf-breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .breathe { animation: none; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="180" fill="url(#bg)"/>
    <rect width="1200" height="180" fill="url(#grid)"/>
    <ellipse class="breathe" cx="600" cy="92" rx="430" ry="96" fill="url(#glow)"/>

    <!-- cable tray -->
    <g stroke="#8FA3C8" stroke-opacity="0.10" stroke-width="1">
      <path d="M40 30h1120M40 150h1120"/>
    </g>

    <!-- trunk: rack -> switch -> router -> firewall -> upstream -->
    <g fill="none" stroke="url(#cable)" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
      <path d="M188 90H286"/>
      <path d="M352 90H556"/>
      <path d="M628 90H796"/>
      <path d="M876 90H1040"/>
    </g>

    <!-- branch stubs to access points -->
    <g fill="none" stroke="url(#cable)" stroke-opacity="0.30" stroke-width="1.4" stroke-linecap="round">
      <path d="M396 90l24-46M396 90l24 46"/>
      <path d="M700 90c40 0 40-34 66-46M700 90c40 0 40 34 66 46"/>
    </g>

    <!-- data pulse travelling the main uplink -->
    <path class="pulse" d="M188 90H286M352 90H556M628 90H796M876 90H1040"
          fill="none" stroke="#7DD3FC" stroke-opacity="0.85" stroke-width="1.8"
          stroke-linecap="round" stroke-dasharray="70 190"/>

    <!-- server rack -->
    <g stroke="#A78BFA" stroke-opacity="0.65" fill="none" stroke-width="1.4">
      <rect x="132" y="40" width="56" height="100" rx="9"/>
      <path d="M132 64h56M132 88h56M132 112h56" stroke-opacity="0.4"/>
    </g>
    <g fill="#7C3AED" fill-opacity="0.85">
      <rect x="140" y="48" width="6" height="9" rx="2"/>
      <rect x="150" y="48" width="6" height="9" rx="2"/>
      <rect x="140" y="72" width="6" height="9" rx="2"/>
      <rect x="150" y="72" width="6" height="9" rx="2"/>
      <rect x="140" y="96" width="6" height="9" rx="2"/>
      <rect x="150" y="96" width="6" height="9" rx="2"/>
      <rect x="140" y="120" width="6" height="9" rx="2"/>
    </g>
    <g fill="#A78BFA" fill-opacity="0.5">
      <rect x="164" y="48" width="16" height="3" rx="1.5"/>
      <rect x="164" y="72" width="16" height="3" rx="1.5"/>
      <rect x="164" y="96" width="16" height="3" rx="1.5"/>
      <rect x="164" y="120" width="16" height="3" rx="1.5"/>
    </g>

    <!-- switch -->
    <g stroke="#22D3EE" stroke-opacity="0.6" fill="none" stroke-width="1.4">
      <rect x="286" y="62" width="66" height="56" rx="9"/>
    </g>
    <g fill="#22D3EE" fill-opacity="0.7">
      <rect x="296" y="106" width="7" height="5" rx="1.5"/>
      <rect x="308" y="106" width="7" height="5" rx="1.5"/>
      <rect x="320" y="106" width="7" height="5" rx="1.5"/>
      <rect x="332" y="106" width="7" height="5" rx="1.5"/>
    </g>
    <g fill="#7DD3FC" fill-opacity="0.55">
      <rect x="296" y="72" width="7" height="22" rx="2"/>
      <rect x="308" y="72" width="7" height="22" rx="2"/>
      <rect x="320" y="72" width="7" height="22" rx="2"/>
      <rect x="332" y="72" width="7" height="22" rx="2"/>
    </g>

    <!-- router -->
    <g>
      <circle cx="592" cy="90" r="36" fill="none" stroke="#6366F1" stroke-opacity="0.6" stroke-width="1.4"/>
      <g stroke="#A78BFA" stroke-opacity="0.75" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M592 62v14M592 104v14M564 90h14M606 90h14"/>
        <path d="m588 68 4-6 4 6M588 112l4 6 4-6M570 86l-6 4 6 4M614 86l6 4-6 4"/>
      </g>
    </g>

    <!-- firewall / uplink appliance -->
    <g stroke="#7DD3FC" stroke-opacity="0.55" fill="none" stroke-width="1.4">
      <rect x="796" y="58" width="80" height="64" rx="10"/>
      <path d="M812 78h48M812 90h48M812 102h30" stroke-opacity="0.35"/>
    </g>
    <g fill="#7DD3FC" fill-opacity="0.5">
      <path d="M860 82h10v4h-10zM858 88h14v4h-14z"/>
    </g>

    <!-- cloud / upstream -->
    <g transform="translate(0,-14)">
      <g fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.4">
        <path d="M1040 104a20 20 0 0 1 2-40 26 26 0 0 1 49-6 18 18 0 0 1 3 46z"/>
      </g>
      <g fill="none" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round">
        <path d="M1112 74a26 26 0 0 1 0 32M1124 66a38 38 0 0 1 0 48"/>
      </g>
    </g>

    <!-- junction nodes -->
    <g fill="#A78BFA">
      <circle cx="454" cy="90" r="3.4" filter="url(#soft)"/>
      <circle cx="712" cy="90" r="3.4" filter="url(#soft)"/>
      <circle cx="938" cy="90" r="3.4" filter="url(#soft)"/>
    </g>
    <g fill="#7DD3FC">
      <circle cx="188" cy="90" r="3"/>
      <circle cx="420" cy="44" r="2.6"/>
      <circle cx="420" cy="136" r="2.6"/>
      <circle cx="766" cy="44" r="2.6"/>
      <circle cx="766" cy="136" r="2.6"/>
      <circle cx="1040" cy="90" r="3"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="179" rx="14" fill="none" stroke="url(#edge)" stroke-width="1"/>
</svg>
