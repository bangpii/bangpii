<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 108" width="1200" height="108" role="img" aria-label="A request travelling the full build path">
  <defs>
    <linearGradient id="bg-build" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.45" stop-color="#0E1730"/>
      <stop offset="0.78" stop-color="#16143A"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="wire-build" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge-build" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow-build" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-build" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#93A7CC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip-build"><rect width="1200" height="108" rx="14"/></clipPath>
    <filter id="soft-build" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>
  <style>
    .breathe { animation: sf-breathe 9s ease-in-out infinite; }
    .pulse { animation: sf-pulse 7s linear infinite; }
    @keyframes sf-breathe { 0%, 100% { opacity: 0.32; } 50% { opacity: 0.72; } }
    @keyframes sf-pulse { to { stroke-dashoffset: -240; } }
    @media (prefers-reduced-motion: reduce) { .breathe, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#clip-build)">
    <rect width="1200" height="108" fill="url(#bg-build)"/>
    <rect width="1200" height="108" fill="url(#grid-build)"/>
    <ellipse class="breathe" cx="600" cy="54" rx="440" ry="54" fill="url(#glow-build)"/>
    <g>
      <path d="M200 54h800" fill="none" stroke="url(#wire-build)" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round"/>
      <path class="pulse" d="M200 54h800" fill="none" stroke="#7DD3FC" stroke-opacity="0.8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="60 180"/>
      <g>
        <circle cx="200" cy="54" r="11" fill="url(#bg-build)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.4"/>
        <circle cx="200" cy="54" r="3" fill="#22D3EE" fill-opacity="0.9"/>
        <rect x="170" y="80" width="60" height="5" rx="2.5" fill="#8FA3C8" fill-opacity="0.26"/>
      </g>
      <g>
        <circle cx="400" cy="54" r="11" fill="url(#bg-build)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.4"/>
        <circle cx="400" cy="54" r="3" fill="#22D3EE" fill-opacity="0.9"/>
        <rect x="370" y="80" width="60" height="5" rx="2.5" fill="#8FA3C8" fill-opacity="0.26"/>
      </g>
      <g>
        <circle cx="600" cy="54" r="11" fill="url(#bg-build)" stroke="#A78BFA" stroke-opacity="0.75" stroke-width="1.4"/>
        <circle cx="600" cy="54" r="3" fill="#A78BFA" fill-opacity="0.9"/>
        <rect x="570" y="80" width="60" height="5" rx="2.5" fill="#8FA3C8" fill-opacity="0.26"/>
      </g>
      <g>
        <circle cx="800" cy="54" r="11" fill="url(#bg-build)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.4"/>
        <circle cx="800" cy="54" r="3" fill="#22D3EE" fill-opacity="0.9"/>
        <rect x="770" y="80" width="60" height="5" rx="2.5" fill="#8FA3C8" fill-opacity="0.26"/>
      </g>
      <g>
        <circle cx="1000" cy="54" r="11" fill="url(#bg-build)" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.4"/>
        <circle cx="1000" cy="54" r="3" fill="#22D3EE" fill-opacity="0.9"/>
        <rect x="970" y="80" width="60" height="5" rx="2.5" fill="#8FA3C8" fill-opacity="0.26"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="107" rx="14" fill="none" stroke="url(#edge-build)" stroke-width="1"/>
</svg>
