<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Three selected project cards">
  <defs>
    <linearGradient id="bg-work" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.45" stop-color="#0E1730"/>
      <stop offset="0.78" stop-color="#16143A"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="wire-work" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge-work" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow-work" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-work" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#93A7CC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip-work"><rect width="1200" height="96" rx="14"/></clipPath>
    <filter id="soft-work" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>
  <style>
    .breathe { animation: sf-breathe 9s ease-in-out infinite; }
    .pulse { animation: sf-pulse 7s linear infinite; }
    @keyframes sf-breathe { 0%, 100% { opacity: 0.32; } 50% { opacity: 0.72; } }
    @keyframes sf-pulse { to { stroke-dashoffset: -240; } }
    @media (prefers-reduced-motion: reduce) { .breathe, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#clip-work)">
    <rect width="1200" height="96" fill="url(#bg-work)"/>
    <rect width="1200" height="96" fill="url(#grid-work)"/>
    <ellipse class="breathe" cx="600" cy="48" rx="440" ry="48" fill="url(#glow-work)"/>
    <g>
      <g>
        <rect x="250" y="20" width="200" height="56" rx="10" fill="url(#wire-work)" fill-opacity="0.06"/>
        <rect x="250" y="20" width="200" height="56" rx="10" fill="none" stroke="#8FA3C8" stroke-opacity="0.22" stroke-width="1.3"/>
        <rect x="266" y="34" width="72" height="7" rx="3.5" fill="#A78BFA" fill-opacity="0.4"/>
        <g fill="#8FA3C8" fill-opacity="0.28">
          <rect x="266" y="50" width="140" height="5" rx="2.5"/>
          <rect x="266" y="62" width="104" height="5" rx="2.5"/>
        </g>
      </g>
      <g>
        <rect x="500" y="20" width="200" height="56" rx="10" fill="url(#wire-work)" fill-opacity="0.14"/>
        <rect x="500" y="20" width="200" height="56" rx="10" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.3"/>
        <rect x="516" y="34" width="72" height="7" rx="3.5" fill="#A78BFA" fill-opacity="0.85"/>
        <g fill="#8FA3C8" fill-opacity="0.28">
          <rect x="516" y="50" width="140" height="5" rx="2.5"/>
          <rect x="516" y="62" width="104" height="5" rx="2.5"/>
        </g>
      </g>
      <g>
        <rect x="750" y="20" width="200" height="56" rx="10" fill="url(#wire-work)" fill-opacity="0.06"/>
        <rect x="750" y="20" width="200" height="56" rx="10" fill="none" stroke="#8FA3C8" stroke-opacity="0.22" stroke-width="1.3"/>
        <rect x="766" y="34" width="72" height="7" rx="3.5" fill="#A78BFA" fill-opacity="0.4"/>
        <g fill="#8FA3C8" fill-opacity="0.28">
          <rect x="766" y="50" width="140" height="5" rx="2.5"/>
          <rect x="766" y="62" width="104" height="5" rx="2.5"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="95" rx="14" fill="none" stroke="url(#edge-work)" stroke-width="1"/>
</svg>
