<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 44" width="1200" height="44" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.75"/>
      <stop offset="0.82" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .slide { animation: sf-slide 11s ease-in-out infinite; }
    .ping { animation: sf-ping 4.5s ease-in-out infinite; }
    @keyframes sf-slide { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
    @keyframes sf-ping { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.5); opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) {
      .slide, .ping { animation: none; }
    }
  </style>

  <rect x="0" y="21" width="1200" height="1" fill="url(#rule)"/>
  <rect class="slide" x="180" y="21" width="240" height="1" fill="url(#flow)"/>
  <circle class="ping" cx="600" cy="21.5" r="4" fill="url(#halo)"/>
  <circle cx="600" cy="21.5" r="2.4" fill="#A78BFA"/>
  <circle cx="588" cy="21.5" r="1.2" fill="#22D3EE" fill-opacity="0.7"/>
  <circle cx="612" cy="21.5" r="1.2" fill="#7C3AED" fill-opacity="0.7"/>
</svg>
