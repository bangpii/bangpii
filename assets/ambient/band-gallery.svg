<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-label="A contact sheet of project screenshots">
  <defs>
    <linearGradient id="bg-gallery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.45" stop-color="#0E1730"/>
      <stop offset="0.78" stop-color="#16143A"/>
      <stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="wire-gallery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="edge-gallery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow-gallery" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-gallery" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#93A7CC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip-gallery"><rect width="1200" height="80" rx="14"/></clipPath>
    <filter id="soft-gallery" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>
  <style>
    .breathe { animation: sf-breathe 9s ease-in-out infinite; }
    .pulse { animation: sf-pulse 7s linear infinite; }
    @keyframes sf-breathe { 0%, 100% { opacity: 0.32; } 50% { opacity: 0.72; } }
    @keyframes sf-pulse { to { stroke-dashoffset: -240; } }
    @media (prefers-reduced-motion: reduce) { .breathe, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#clip-gallery)">
    <rect width="1200" height="80" fill="url(#bg-gallery)"/>
    <rect width="1200" height="80" fill="url(#grid-gallery)"/>
    <ellipse class="breathe" cx="600" cy="40" rx="440" ry="40" fill="url(#glow-gallery)"/>
    <g>
      <rect x="61" y="20" width="168" height="40" rx="8"
        fill="url(#wire-gallery)" fill-opacity="0.09"
        stroke="#8FA3C8" stroke-opacity="0.3" stroke-width="1.2"/>
      <rect x="243" y="20" width="168" height="40" rx="8"
        fill="url(#wire-gallery)" fill-opacity="0.2"
        stroke="#A78BFA" stroke-opacity="0.62" stroke-width="1.2"/>
      <rect x="425" y="20" width="168" height="40" rx="8"
        fill="url(#wire-gallery)" fill-opacity="0.09"
        stroke="#8FA3C8" stroke-opacity="0.3" stroke-width="1.2"/>
      <rect x="607" y="20" width="168" height="40" rx="8"
        fill="url(#wire-gallery)" fill-opacity="0.09"
        stroke="#8FA3C8" stroke-opacity="0.3" stroke-width="1.2"/>
      <rect x="789" y="20" width="168" height="40" rx="8"
        fill="url(#wire-gallery)" fill-opacity="0.2"
        stroke="#A78BFA" stroke-opacity="0.62" stroke-width="1.2"/>
      <rect x="971" y="20" width="168" height="40" rx="8"
        fill="url(#wire-gallery)" fill-opacity="0.09"
        stroke="#8FA3C8" stroke-opacity="0.3" stroke-width="1.2"/>
      <g stroke="url(#wire-gallery)" stroke-opacity="0.4" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 8">
        <path d="M61 70h1078"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="79" rx="14" fill="none" stroke="url(#edge-gallery)" stroke-width="1"/>
</svg>
